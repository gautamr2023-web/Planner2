<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEEF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1218" media="(prefers-color-scheme: dark)">
<meta name="description" content="Plan study days, tests and marks for JEE Mains.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JEE Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>JEE Mains Planner</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Layout: slim top bar with the exam countdown; calendar (month / week / day) on the left, a sticky day panel on the right.
   Study hours are drawn as OMR-sheet bubbles: 14 per day, bubbles 12-14 ringed as the target zone. Everything else stays quiet. */
:root{
  --bg:#ECEEF2; --surface:#FFFFFF; --surface-2:#F4F5F8; --ink:#12161E; --ink-2:#464E5E; --ink-3:#6B7385;
  --line:#DCE0E8; --line-strong:#B2B9C7;
  --s-p:#2F6FDE; --s-c:#C25A00; --s-m:#7B45C9; --s-t:#12161E; --s-r:#8A92A3;
  --on-sub:#FFFFFF; --ok:#13744B; --over:#C42B2B;
  --plan:color-mix(in srgb,var(--ink) 26%,transparent);
  --over-fill:color-mix(in srgb,var(--over) 62%,transparent);
  --shadow:0 2px 4px rgba(18,22,30,.08),0 14px 40px rgba(18,22,30,.18);
  --font:'Archivo','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1117; --surface:#161A22; --surface-2:#1C212B; --ink:#E8EBF2; --ink-2:#AAB2C2; --ink-3:#8590A3;
    --line:#272D39; --line-strong:#3B4352;
    --s-p:#4A8FEB; --s-c:#E0672C; --s-m:#9085E9; --s-t:#E8EBF2; --s-r:#8590A3;
    --on-sub:#0B0E14; --ok:#46C58B; --over:#FF7A7A;
    --shadow:0 2px 4px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#161A22; --surface-2:#1C212B; --ink:#E8EBF2; --ink-2:#AAB2C2; --ink-3:#8590A3;
  --line:#272D39; --line-strong:#3B4352;
  --s-p:#4A8FEB; --s-c:#E0672C; --s-m:#9085E9; --s-t:#E8EBF2; --s-r:#8590A3;
  --on-sub:#0B0E14; --ok:#46C58B; --over:#FF7A7A;
  --shadow:0 2px 4px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.k-P{--k:var(--s-p)} .k-C{--k:var(--s-c)} .k-M{--k:var(--s-m)} .k-T{--k:var(--s-t)} .k-R{--k:var(--s-r)} .k-O{--k:var(--ink-3)}
.chip{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--k);color:var(--on-sub);font-weight:800;font-size:11px;flex:none;line-height:1}
.k-R .chip{background:transparent;border:1.5px dashed var(--s-r);color:var(--ink-3)}

/* top bar */
.top{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-stretch:75%;font-weight:800;font-size:24px;letter-spacing:-.01em;margin-right:auto;line-height:1.1}
.logo{display:flex;gap:3px} .logo i{width:11px;height:11px;border-radius:50%;background:var(--k);display:block}
.count{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 16px 8px 12px;text-align:left}
.count b{font-stretch:62%;font-weight:800;font-size:40px;line-height:1;letter-spacing:-.01em;min-width:2ch;text-align:right}
.count .ct2{display:flex;flex-direction:column;font-size:12px;color:var(--ink-2);line-height:1.35}
.count strong{color:var(--ink);font-weight:600;font-size:13px}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:4px 0 2px;width:100%;min-width:140px}
.meter i{display:block;height:100%;background:var(--ink)}
.save{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.save.link{background:none;border:0;padding:4px 0;cursor:pointer;font:inherit;font-size:12px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:block}
.save.ok i{background:var(--ok)} .save.err i{background:var(--over)}
.ib{width:36px;height:36px;display:inline-grid;place-items:center;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:0}
.ib svg{width:18px;height:18px}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border:1px dashed var(--line-strong);border-radius:10px;padding:10px 14px;background:var(--surface);color:var(--ink-2)}
.banner span{flex:1 1 260px}

/* controls */
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.nav{display:flex;align-items:center;gap:6px}
.nav h2{margin:0 8px;font-size:22px;font-stretch:75%;font-weight:700;line-height:1.1;min-width:11ch;text-align:center}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;line-height:1.2}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--over)}
.btn[aria-expanded="true"]{background:var(--surface-2);border-color:var(--ink-2)}
.sp{flex:1}
.ctl .sp{min-width:0}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.main{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:1040px){
  .layout{grid-template-columns:minmax(0,1fr) 372px}
  #panel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;overscroll-behavior:contain}
}

/* summary strip */
.sum{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat b{font-stretch:75%;font-weight:700;font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--ink-2)}
.split{flex:1 1 260px;min-width:220px}
.splitbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.splitbar i{display:block;height:100%;background:var(--k)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--k);display:inline-block}

/* bubbles */
.bub{display:grid;grid-template-columns:repeat(var(--n,14),minmax(0,1fr));gap:4px}
.bub i{display:block;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line-strong);
  background:linear-gradient(to top,var(--ink) calc(var(--d)*1%),transparent 0),linear-gradient(to top,var(--plan) calc(var(--p)*1%),transparent 0)}
.bub i.tz{border-color:var(--ink-2)}
.bub.over i{border-color:var(--over);background:linear-gradient(to top,var(--ink) calc(var(--d)*1%),transparent 0),var(--over-fill)}
.bnum{display:grid;grid-template-columns:repeat(var(--n,14),minmax(0,1fr));gap:4px;margin-top:3px;font-size:10px;color:var(--ink-3);text-align:center}
.bnum span.tz{color:var(--ink);font-weight:700}

/* shared blocks */
.blk{background:color-mix(in srgb,var(--k) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--k) 45%,var(--surface));border-radius:8px;color:var(--ink)}
.k-T.blk{background:var(--s-t);border-color:var(--s-t);color:var(--on-sub)}
.k-T.blk .chip{background:var(--on-sub);color:var(--s-t)}
.k-T.blk .btn{background:transparent;color:var(--on-sub);border-color:color-mix(in srgb,var(--on-sub) 45%,transparent)}
.k-R.blk{background:transparent;border:1px dashed var(--line-strong)}
.blk.done{opacity:.6}
.blk.done .cbody b{text-decoration:line-through}
.cbody{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit}
.cbody b{display:block;font-weight:600;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.cbody small{display:block;font-size:11px;opacity:.75;line-height:1.3;margin-top:1px}
.chk{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid currentColor;background:none;padding:0;display:inline-grid;place-items:center;opacity:.7;color:inherit}
.chk svg{width:12px;height:12px;opacity:0}
.chk.on{background:var(--ink);border-color:var(--ink);color:var(--bg);opacity:1}
.k-T .chk.on{background:var(--on-sub);border-color:var(--on-sub);color:var(--s-t)}
.chk.on svg{opacity:1}

/* calendar shell */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);background:var(--surface-2)}
.mh span{padding:8px;font-size:12px;font-weight:600;color:var(--ink-2)}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line)}
.cell{position:relative;display:flex;flex-direction:column;gap:6px;min-height:106px;padding:7px 8px;border:0;border-radius:0;background:var(--surface);text-align:left;min-width:0}
.cell:hover{background:var(--surface-2)}
.cell.out{background:var(--surface-2);color:var(--ink-3)}
.cell.out .bub{opacity:.55}
.cell.sel{outline:2px solid var(--ink);outline-offset:-2px;z-index:1}
.drop{background:color-mix(in srgb,var(--ink) 10%,var(--surface)) !important}
.timerw{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;width:min(560px,calc(100% - 24px))}
.timerw[hidden]{display:none}
body.has-timer{padding-bottom:130px}
.gapb{position:absolute;left:2px;right:2px;border-radius:6px;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--ink) 5%,transparent) 6px 7px);border:1px dashed var(--line);pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-3)}
.tmn{margin:0 0 8px;font-size:12px;color:var(--ink-2)}
#lf .kopt .kb b{font-weight:700;margin-right:3px}
.has-timer .toastw{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.tmr{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px 12px}
.tmr.up{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok),var(--shadow)}
.tmi{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.tmt{font-weight:600;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmi b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tmb{height:4px;border-radius:2px;background:var(--line);margin:8px 0 10px;overflow:hidden}
.tmb i{display:block;height:100%;width:0;background:var(--ink);transition:width .9s linear}
.tmr .acts{display:flex;flex-wrap:wrap;gap:6px}
.btn.focus{width:100%;justify-content:center;gap:8px;display:flex;align-items:center}
.btn.focus svg,.mvb svg{width:14px;height:14px;flex:none}
.rv{display:flex;flex-direction:column;gap:12px}
.rvs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rvs b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.rvs span{font-size:12px;color:var(--ink-2)}
.dcols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.dcol{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--ink-2)}
.dcol b{color:var(--ink);font-size:13px}
.dcol small{font-size:11px;color:var(--ink-3)}
.dcol.today span{font-weight:700;color:var(--ink)}
.dbar{position:relative;width:100%;max-width:56px;height:130px;display:flex;align-items:flex-end;margin-bottom:4px}
.dbar::after{content:"";position:absolute;left:-3px;right:-3px;bottom:var(--t);border-top:1px solid var(--ink-3)}
.dbar i{position:absolute;left:0;right:0;bottom:0;border-radius:3px 3px 0 0}
.dbar .pl{border:1px solid var(--line-strong);background:none}
.dbar .dn{background:var(--ink);left:6px;right:6px;opacity:.85}
.srow{display:grid;grid-template-columns:90px minmax(0,1fr) auto;align-items:center;gap:12px;padding:5px 0}
.sl{font-size:13px;font-weight:600}
.sbar{position:relative;height:10px}
.sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.sbar .pl{background:color-mix(in srgb,var(--c) 25%,var(--surface))}
.sbar .dn{background:var(--c)}
.srow.k-P{--c:var(--s-p)} .srow.k-C{--c:var(--s-c)} .srow.k-M{--c:var(--s-m)} .srow.k-T{--c:var(--ink)}
.sv{font-size:12px;color:var(--ink-2);white-space:nowrap}
.sv b{color:var(--ink)}
.rvn{margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.rvt{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.rvt b{font-weight:600} .rvt small{display:block;color:var(--ink-3);font-size:12px}
@media (max-width:640px){.rvs{grid-template-columns:repeat(2,minmax(0,1fr))}.srow{grid-template-columns:70px minmax(0,1fr)}.srow .sv{grid-column:1/-1}.dbar{height:100px}}
.bankz.drop{outline:2px dashed var(--ink);outline-offset:-4px}
.tb.to-bank{opacity:.7;box-shadow:0 0 0 2px var(--ink)}
.banner.miss{border-style:solid;border-color:var(--over)}
.mvb{width:26px;height:26px;flex:none;border-radius:6px;border:1px solid transparent;background:none;padding:0;display:inline-grid;place-items:center;color:inherit;opacity:.7}
.mvb:hover{opacity:1;background:color-mix(in srgb,var(--ink) 8%,transparent);border-color:var(--line-strong)}
.mvb svg{width:15px;height:15px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fchip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.qb{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px}
.qb select,.qb input{height:32px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--ink);padding:0 8px;font:inherit;font-size:13px;min-width:0}
.bbtns{display:flex;flex-direction:column;gap:4px;flex:none}
.miss-tag{font-weight:700;color:var(--over)}
.k-T .miss-tag{color:inherit;text-decoration:underline}
@media (max-width:640px){.qb{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}.qb input{grid-column:1/-1;order:3}.qb .btn{order:4;grid-column:1/-1}}
.cell .bub{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cell .bub i{border-width:1px}
.ct{display:flex;justify-content:space-between;align-items:center;gap:4px}
.dn{font-weight:700;font-size:14px;min-width:24px;height:24px;display:inline-grid;place-items:center;border-radius:12px;padding:0 5px}
.cell.today .dn{background:var(--ink);color:var(--bg)}
.hrs{font-size:12px;font-weight:600;color:var(--ink-2)}
.hrs.ok{color:var(--ok)} .hrs.over{color:var(--over)}
.cf{margin-top:auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 4px;font-size:11px;color:var(--ink-3);min-height:15px}
.cf .hm{display:none}
.tag{font-weight:700;background:var(--ink);color:var(--bg);border-radius:3px;padding:0 5px;font-style:normal;font-size:10px;line-height:15px}
@media (max-width:640px){
  .cell{min-height:80px;padding:4px;gap:4px}
  .cell .bub{gap:2px}
  .cf .cnt{display:none}
  .ct .hrs{display:none}
  .cf .hm{display:inline;font-size:10.5px}
  .dn{font-size:12px;min-width:20px;height:20px;padding:0 3px}
  .mh span{padding:6px 4px;font-size:11px}
  .nav h2{font-size:18px;min-width:9ch}
  .count b{font-size:34px}
  .tag{font-size:9px;padding:0 3px}
}

/* week */
.wk{overflow-x:auto}
.wg{display:grid;grid-template-columns:repeat(7,minmax(168px,1fr));gap:1px;background:var(--line);min-width:min-content}
.wc{background:var(--surface);display:flex;flex-direction:column;min-height:440px;min-width:0}
.wc.sel{box-shadow:inset 0 3px 0 var(--ink)}
.wh{display:flex;flex-direction:column;gap:7px;padding:10px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.wh .row1{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.wh b{font-stretch:75%;font-size:18px;font-weight:700}
.wc.today .wh b{background:var(--ink);color:var(--bg);border-radius:6px;padding:0 7px}
.wh .bub{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wh .bub i{border-width:1px}
.wl{display:flex;flex-direction:column;gap:6px;padding:8px;flex:1}
.wcard{display:flex;gap:7px;align-items:flex-start;padding:7px 8px}
.wcard[draggable="true"]{cursor:grab}
.wadd{margin-top:auto;border:1px dashed var(--line-strong);background:none;border-radius:8px;padding:6px;color:var(--ink-2);font-weight:600;font-size:12px}
.dragging{opacity:.45}

/* day timeline */
.tlw{max-height:min(76vh,800px);overflow-y:auto;overscroll-behavior:contain}
.tli{position:relative;margin:14px 12px 14px 0}
.hl{position:absolute;left:56px;right:0;border-top:1px solid var(--line);height:0}
.hl span{position:absolute;left:-56px;top:-8px;width:46px;text-align:right;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tbs{position:absolute;left:60px;right:0;top:0;bottom:0}
.tb{position:absolute;display:flex;align-items:flex-start;gap:6px;padding:4px 6px 4px 4px;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:grab}
.tb.sm .cbody small,.tb.xs .cbody small{display:none}
.tb.sm{align-items:center;padding-block:1px}
.tb.sm .chip{width:16px;height:16px;font-size:10px}
.tb.sm .chk{width:16px;height:16px} .tb.sm .chk svg{width:9px;height:9px}
.tb.sm .grip,.tb.xs .grip{align-self:center;height:12px}
.tb.sm .rs,.tb.xs .rs{height:6px} .tb.sm .rs::after,.tb.xs .rs::after{display:none}
.tb.xs{align-items:center;padding-block:0}
.tb.xs .chip,.tb.xs .chk{display:none}
.tb.xs .cbody b{font-size:11px;line-height:12px}
.tb.dragging-now{box-shadow:var(--shadow);z-index:5;opacity:.95}
.grip{flex:none;width:12px;align-self:stretch;display:flex;align-items:center;justify-content:center;touch-action:none;opacity:.5;cursor:grab}
.grip::before{content:"";width:6px;height:16px;background:radial-gradient(circle,currentColor 1.1px,transparent 1.4px) 0 0/6px 6px}
.rs{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize;touch-action:none}
.rs::after{content:"";position:absolute;left:50%;bottom:2px;width:22px;height:3px;border-radius:2px;background:currentColor;opacity:.35;transform:translateX(-50%)}

var dbDoc=null,saveT=0,dirty=false,busy=false,saveState='local';
var SAVE_TXT={local:'Saved on this device only',signedout:'Not signed in · tap to sync',ready:'Syncs to your account',saving:'Saving…',synced:'Saved to your account',error:'Saved on this device · sync will retry'};
function saveHTML(){var c=saveState==='synced'||saveState==='ready'?' ok':saveState==='error'?' err':'';
  if(sb)return '<button type="button" class="save link" id="save" data-act="auth"><i></i>'+SAVE_TXT[saveState]+'</button>';
  return '<span class="save'+c+'" id="save"><i></i>'+SAVE_TXT[saveState]+'</span>'}
function setSave(s){saveState=s;var el=$('#save');if(el)el.outerHTML=saveHTML()}
function persist(){
  state.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(serialize()))}catch(e){}
  dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,800);
  setSave(dbDoc?'saving':'local');
}
function flush(){
  if(!dbDoc||!dirty)return;
  if(busy){saveT=setTimeout(flush,400);return}
  busy=true;dirty=false;
  var body=JSON.stringify(serialize());
  var p;
  try{
    if(body.length>240000)throw new Error('size');
    p=dbDoc.set({planJson:body,savedAt:Date.now()});
  }catch(e){p=Promise.reject(e)}
  var failed=false;
  p.then(function(){setSave(dirty?'saving':'synced')},function(){failed=true;dirty=true;setSave('error')}).then(function(){
    busy=false;clearTimeout(saveT);
    if(dirty)saveT=setTimeout(flush,failed?20000:400);
  });
}
function readLS(){try{var s=localStorage.getItem(LS);return s?JSON.parse(s):null}catch(e){return null}}
function adopt(remote){
  state=remote;rebuild();
  try{localStorage.setItem(LS,JSON.stringify(serialize()))}catch(e){}
  render();
}
/* ---- Supabase sync ---- */
var CFG=window.JEE_CONFIG||{},sb=null,sbUser=null,unsub=null;
function sbConfigured(){return !!(CFG.supabaseUrl&&CFG.supabaseAnonKey&&!/YOUR_/.test(CFG.supabaseUrl+CFG.supabaseAnonKey)&&window.supabase&&window.supabase.createClient)}
function sbRef(uid){
  return {
    set:function(d){
      return sb.from('planner_state').upsert({user_id:uid,plan:JSON.parse(d.planJson),updated_at:new Date().toISOString()},{onConflict:'user_id'})
        .then(function(r){if(r.error)throw r.error});
    },
    onSnapshot:function(next,err){
      var dead=false;
      function emit(row){next({exists:!!row,data:function(){return row?{planJson:JSON.stringify(row.plan)}:{}}})}
      function pull(){
        return sb.from('planner_state').select('plan').eq('user_id',uid).maybeSingle().then(function(r){
          if(dead)return;
          if(r.error){if(err)err(r.error);return}
          emit(r.data);
        },function(e){if(!dead&&err)err(e)});
      }
      pull();
      var ch=sb.channel('planner-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'planner_state',filter:'user_id=eq.'+uid},function(p){
        if(!dead&&p.new&&p.new.plan)emit({plan:p.new.plan});
      }).subscribe();
      var vis=function(){if(document.visibilityState==='visible')pull()};
      document.addEventListener('visibilitychange',vis);window.addEventListener('online',pull);
      var poll=setInterval(vis,30000);
      return function(){dead=true;try{sb.removeChannel(ch)}catch(e){}document.removeEventListener('visibilitychange',vis);window.removeEventListener('online',pull);clearInterval(poll)};
    }
  };
}
function startSync(uid){
  stopSync();
  var ref=sbRef(uid),first=true;
  setSave('saving');
  unsub=ref.onSnapshot(function(snap){
    var remote=null;
    if(snap.exists){try{remote=hydrate(JSON.parse((snap.data()||{}).planJson))}catch(x){remote=null}}
    if(first){
      first=false;dbDoc=ref;
      if(remote&&!dirty&&(remote.updated>=state.updated||!hadLocal)){adopt(remote);setSave('synced')}
      else if(dirty||hadLocal){if(!state.updated)state.updated=Date.now();dirty=true;flush()}
      else setSave('ready');
      return;
    }
    if(remote&&remote.updated>state.updated&&!dirty&&!busy){adopt(remote);setSave('synced')}
    else if(saveState==='error'&&!dirty)setSave('synced');
  },function(){setSave('error')});
}
function stopSync(){if(unsub){unsub();unsub=null}dbDoc=null}
function connect(){
  if(!sbConfigured())return;
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(function(ev,session){
    var u=session&&session.user;
    if(u&&(!sbUser||sbUser.id!==u.id)){sbUser=u;startSync(u.id);if(ui.overlay&&ui.overlay.kind==='auth')closeOv()}
    else if(!u&&sbUser){sbUser=null;stopSync();setSave('signedout')}
  });
  sb.auth.getSession().then(function(r){if(!(r&&r.data&&r.data.session)&&!sbUser)setSave('signedout')});
  window.addEventListener('online',function(){if(dbDoc){dirty=true;flush()}});
}
function openAuth(){
  ui.overlay={kind:'auth'};
  if(sbUser){
    openOv('<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="afh"><h3 id="afh">Your account</h3>'+
      '<p style="margin:0">Signed in as <b>'+esc(sbUser.email||'')+'</b>. '+esc(SAVE_TXT[saveState])+'.</p>'+
      '<div class="actions"><button type="button" class="btn" data-act="sync-now">Sync now</button><span class="sp"></span><button type="button" class="btn" data-act="close-ov">Close</button><button type="button" class="btn danger" data-act="sign-out">Sign out</button></div>'+
      '<small style="color:var(--ink-3)">Signing out also clears the copy stored on this device. Your plan stays in your account.</small></div>');
    return;
  }
  openOv('<form class="sheet" id="af" role="dialog" aria-modal="true" aria-labelledby="afh">'+
    '<h3 id="afh">Sign in to sync</h3>'+
    '<p style="margin:0;color:var(--ink-2)">One account keeps your plan the same on your phone and laptop.</p>'+
    '<label class="f">Email<input type="email" name="email" id="af-email" autocomplete="email" required></label>'+
    '<label class="f">Password<input type="password" name="password" autocomplete="current-password" minlength="6"><small>At least 6 characters. Not needed for the email link.</small></label>'+
    '<p class="err" id="af-msg" role="status" hidden></p>'+
    '<div class="actions"><button type="button" class="btn" data-act="auth-magic">Email me a link</button><span class="sp"></span><button type="button" class="btn" data-act="auth-signup">Create account</button><button type="submit" class="btn pri">Sign in</button></div></form>','#af-email');
}
function authMsg(t,ok){var m=$('#af-msg');if(!m)return;m.hidden=!t;m.textContent=t||'';m.style.color=ok?'var(--ok)':''}
function authDo(kind){
  var f=$('#af');if(!f||!sb)return;
  var email=f.email.value.trim(),pw=f.password.value;
  if(!email){authMsg('Enter your email.');return}
  var p;
  if(kind==='magic')p=sb.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.href.split('#')[0]}});
  else{
    if(pw.length<6){authMsg('Password needs at least 6 characters.');return}
    p=kind==='signup'?sb.auth.signUp({email:email,password:pw,options:{emailRedirectTo:location.href.split('#')[0]}}):sb.auth.signInWithPassword({email:email,password:pw});
  }
  authMsg('Working…',true);
  p.then(function(r){
    if(r.error){authMsg(r.error.message||'Something went wrong.');return}
    if(kind==='magic')authMsg('Check your email for the sign-in link.',true);
    else if(kind==='signup'&&!(r.data&&r.data.session))authMsg('Account created. Check your email to confirm it, then sign in.',true);
  },function(){authMsg('Could not reach the server. Check your connection.')});
}

/* mutations */
function mutate(fn,msg){
  var snap=JSON.stringify(state.tasks);
  fn();rebuild();persist();render();
  var m=typeof msg==='function'?msg():msg;
  if(m)toast(m,function(){state.tasks=JSON.parse(snap);rebuild();persist();render()});
}
function toggleDone(id){
  var t=get(id);if(!t)return;
  var now=!t.done;
  mutate(function(){t.done=now;t.log=null},now?null:null);
  if(now&&t.kind!=='R'&&!t.test){
    var u=function(){t.done=false;t.log=null;rebuild();persist();render()};
    toast('Marked done',u,'Only partly?',function(){openLog(id)});
  }else ui.undo=null;
}

/* backlog: send unfinished work to the bank, and place it back automatically */
var movable=function(t){return t&&t.date&&!t.test&&t.kind!=='R'&&!t.done};
function toBank(ids,msg){
  var ts=ids.map(get).filter(movable);
  if(!ts.length){toast(ids.length===1&&get(ids[0])&&get(ids[0]).test?'Tests keep their date. Use Edit test to change it.':ids.length===1&&get(ids[0])&&get(ids[0]).done?'That task is already done.':'Nothing to move.');return}
  mutate(function(){ts.forEach(function(t){t.from=t.date;t.date='';t.start=null;t.done=false;t.sample=false})},
    msg||('Moved “'+ts[0].title+'” to the bank'));
}
var missed=function(){return state.tasks.filter(function(t){return t.date&&t.date<TODAY&&movable(t)&&!t.sample})};
function planSlot(t){
  return planSlotCap(t,state.settings.min*60)||planSlotCap(t,state.settings.max*60);
}
function planSlotCap(t,max){
  for(var i=0;i<45;i++){
    var d=addDays(TODAY,i),from=360;
    if(d===TODAY){var n=new Date();from=Math.max(360,Math.ceil((n.getHours()*60+n.getMinutes())/15)*15)}
    if(dayStats(d).study+t.dur>max)continue;
    var st=findSlot(d,t.dur,from,t.id);
    if(st<from||st+t.dur>1380)continue;
    if(onDay(d).some(function(x){return x.id!==t.id&&x.start<st+t.dur&&x.start+x.dur>st}))continue;
    return {date:d,start:st};
  }
  return null;
}
function autoPlace(id){
  var t=get(id);if(!t)return;
  var p=planSlot(t);
  if(!p){toast('No free slot in the next 6 weeks. Raise the daily maximum in settings or shorten the task.');return}
  ui.sel=p.date;
  mutate(function(){t.date=p.date;t.start=p.start;t.from='';t.sample=false},'Scheduled “'+t.title+'” on '+shortDate(p.date)+' at '+clock(p.start));
}
function autoFill(){
  var list=bank().slice().sort(function(a,b){return (a.from||'9')<(b.from||'9')?-1:(a.from||'9')>(b.from||'9')?1:0}),ok=0,first=null;
  if(!list.length)return;
  mutate(function(){
    list.forEach(function(t){
      var p=planSlot(t);if(!p)return;
      t.date=p.date;t.start=p.start;t.from='';t.sample=false;rebuild();ok++;if(!first||p.date<first)first=p.date;
    });
  },function(){return ok?'Scheduled '+ok+' of '+list.length+' backlog item'+(list.length>1?'s':'')+' into free slots'+(ok<list.length?'. The rest did not fit.':''):'Nothing fit in the next 6 weeks.'});
  if(first)ui.sel=first,render();
}
function moveTask(id,date,minute){
  var t=get(id);if(!t)return;
  var was=t.date;
  if(was===date&&minute==null)return;
  ui.sel=date;
  mutate(function(){
    t.date=date;
    if(minute!=null)t.start=minute;
    else if(t.start==null||!was)t.start=findSlot(date,t.dur,360,t.id);
    t.sample=false;t.from='';
  },'Moved “'+t.title+'” to '+shortDate(date));
}
function applyTemplate(key){
  var tp=TEMPLATES[key],d=ui.sel;
  ui.menu=null;ui.confirm=null;
  mutate(function(){
    state.tasks=state.tasks.filter(function(t){return t.date!==d});
    tp.items.forEach(function(i){state.tasks.push({id:uid(),title:i[4],kind:i[2],type:i[3],date:d,start:i[0],dur:i[1],done:false,sample:false,test:i[5]?cloneTest(i[5]):null})});
  },tp.name+' added to '+shortDate(d));
}
function copyDay(mode){
  var src=onDay(ui.sel).slice(),targets=[],i;
  ui.menu=null;
  if(!src.length){toast('This day has no tasks to copy.');render();return}
  if(mode==='next')targets=[addDays(ui.sel,1)];
  if(mode==='week'){var end=addDays(startOfWeek(ui.sel),6);for(var d=addDays(ui.sel,1);d<=end;d=addDays(d,1))targets.push(d)}
  if(mode==='7')for(i=1;i<=7;i++)targets.push(addDays(ui.sel,i));
  if(!targets.length){toast('No days left in this week.');render();return}
  var copied=0,skipped=0;
  mutate(function(){
    targets.forEach(function(d){
      if(onDay(d).length){skipped++;return}
      copied++;
      src.forEach(function(t){state.tasks.push({id:uid(),title:t.title,kind:t.kind,type:t.type,date:d,start:t.start,dur:t.dur,done:false,sample:false,test:t.test?cloneTest(t.test):null})});
    });
  },function(){return copied?'Copied to '+copied+' day'+(copied>1?'s':'')+(skipped?' ('+skipped+' skipped: already planned)':''):'Nothing copied: those days already have tasks.'});
}

/* ---------- rendering ---------- */
function bubbles(study,done,cls,nums){
  var S=state.settings,N=Math.max(14,Math.ceil(S.max)),sh=study/60,dh=done/60,over=sh>S.max,out='',nn='';
  for(var i=1;i<=N;i++){
    var p=over?100:clamp(sh-(i-1),0,1)*100,d=clamp(dh-(i-1),0,1)*100,tz=i>=S.min&&i<=S.max?' class="tz"':'';
    out+='<i'+tz+' style="--p:'+p.toFixed(0)+';--d:'+d.toFixed(0)+'"></i>';
    if(nums)nn+='<span'+(i>=S.min&&i<=S.max?' class="tz"':'')+'>'+i+'</span>';
  }
  var label=hh(study)+' planned, '+hh(done)+' done, target '+S.min+' to '+S.max+' hours';
  return '<span class="bub'+(over?' over':'')+(cls?' '+cls:'')+'" style="--n:'+N+'" role="img" aria-label="'+label+'">'+out+'</span>'+(nums?'<div class="bnum" style="--n:'+N+'" aria-hidden="true">'+nn+'</div>':'');
}
function loadStatus(m){
  var S=state.settings,lo=S.min*60,hi=S.max*60;
  if(m===0)return {cls:'',text:'Nothing planned yet'};
  if(m<lo)return {cls:'',text:dur(lo-m)+' more to reach '+S.min+'h'};
  if(m<=hi)return {cls:'ok',text:'In the '+S.min+'–'+S.max+'h target'};
  return {cls:'over',text:dur(m-hi)+' over '+S.max+'h'};
}
function hrsClass(m){var S=state.settings;return m>S.max*60?'over':m>=S.min*60?'ok':''}

function renderTop(){
  var S=state.settings,n=dayDiff(TODAY,S.exam),planned=0;
  idx.forEach(function(l,d){if(d>=TODAY&&d<=S.exam)l.forEach(function(t){if(t.kind!=='R')planned+=t.dur})});
  var need=Math.max(n+1,0)*S.min*60,pct=need?Math.min(100,planned/need*100):0;
  $('#top').innerHTML=
   '<div class="brand"><span class="logo"><i class="k-P"></i><i class="k-C"></i><i class="k-M"></i></span>JEE Mains Planner</div>'+
   '<button class="count" data-act="settings" aria-label="Exam date and targets">'+
     '<b class="num">'+(n>=0?n:'—')+'</b>'+
     '<span class="ct2"><strong>'+(n>0?'days to JEE Main':n===0?'JEE Main is today':'Exam date has passed')+'</strong>'+
     '<span>'+longDate(S.exam)+'</span>'+
     (n>=0?'<span class="meter" role="img" aria-label="'+Math.round(pct)+'% of target hours planned"><i style="width:'+pct.toFixed(1)+'%"></i></span><span class="num">'+hh(planned)+' of '+hh(need)+' planned at '+S.min+'h/day</span>':'')+
     '</span></button>'+
   saveHTML()+
   '<button class="ib" data-act="settings" aria-label="Settings"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg></button>';
}
function renderBanner(){
  var el=$('#banner'),has=state.tasks.some(function(t){return t.sample}),ms=ui.hideMissed?[]:missed(),h='';
  if(ms.length){var mm=ms.reduce(function(a,t){return a+t.dur},0);
    h+='<div class="banner miss"><span><b>'+ms.length+' unfinished task'+(ms.length>1?'s':'')+'</b> from earlier days ('+hh(mm)+'). Move them to the backlog, then place them in free slots.</span><button class="btn sm pri" data-act="missed-bank">Move to backlog</button><button class="btn sm" data-act="missed-hide">Hide</button></div>'}
  if(dow(TODAY)===6&&!ui.hideReview&&ui.view!=='review')h+='<div class="banner"><span><b>It is Sunday.</b> Look back at the week and plan the next one.</span><button class="btn sm pri" data-act="review-open">Open weekly review</button><button class="btn sm" data-act="review-hide">Hide</button></div>';
  if(has)h+='<div class="banner"><span>A sample plan is loaded so you can see how the planner works. Your own tasks will sit next to it.</span><button class="btn sm" data-act="clear-samples">Clear samples</button><button class="btn sm" data-act="keep-samples">Keep and edit</button></div>';
  el.hidden=!h;el.innerHTML=h;
}
function periodLabel(){
  var x=parse(ui.sel);
  if(ui.view==='month')return MONL[x.getMonth()]+' '+x.getFullYear();
  if(ui.view==='day')return longDate(ui.sel);
  var a=startOfWeek(ui.sel),b=addDays(a,6),pa=parse(a),pb=parse(b);
  return pa.getMonth()===pb.getMonth()?pa.getDate()+'–'+pb.getDate()+' '+MON[pb.getMonth()]+' '+pb.getFullYear():pa.getDate()+' '+MON[pa.getMonth()]+' – '+pb.getDate()+' '+MON[pb.getMonth()]+' '+pb.getFullYear();
}
function renderControls(){
  var seg=['month','week','day','tests','review'].map(function(v){return '<button data-act="view" data-v="'+v+'" aria-pressed="'+(ui.view===v)+'">'+v[0].toUpperCase()+v.slice(1)+'</button>'}).join('');
  var h='<div class="seg" role="group" aria-label="View">'+seg+'</div>';
  if(ui.view==='tests')h+='<h2 class="th">Tests and results</h2><span class="sp"></span><button class="btn" data-act="import">Import schedule</button><button class="btn pri" data-act="add-test">+ Add test</button>';
  else h+='<div class="nav"><button class="ib" data-act="prev" aria-label="Previous">\u2039</button><h2>'+periodLabel()+'</h2><button class="ib" data-act="next" aria-label="Next">\u203a</button></div>'+
    '<button class="btn" data-act="today">Today</button><span class="sp"></span>'+
    '<button class="btn pri" data-act="add" data-date="'+ui.sel+'">+ Add task</button>';
  $('#controls').innerHTML=h;
}
function renderSummary(){
  var el=$('#summary');
  if(ui.view==='day'||ui.view==='tests'||ui.view==='review'){el.hidden=true;el.innerHTML='';return}
  el.hidden=false;
  var dates=[],S=state.settings,i;
  if(ui.view==='week'){var a=startOfWeek(ui.sel);for(i=0;i<7;i++)dates.push(addDays(a,i))}
  else{var x=parse(ui.sel),dim=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(),f=iso(new Date(x.getFullYear(),x.getMonth(),1));for(i=0;i<dim;i++)dates.push(addDays(f,i))}
  var plan=0,done=0,inT=0,days=0,sub={P:0,C:0,M:0,T:0};
  dates.forEach(function(d){
    var st=dayStats(d);plan+=st.study;done+=st.done;
    if(st.study){days++;if(st.study>=S.min*60&&st.study<=S.max*60)inT++}
    Object.keys(sub).forEach(function(k){sub[k]+=st.sub[k]});
  });
  var per=ui.view==='week'?'week':'month';
  var tgt=ui.view==='week'?'<span>Target '+(S.min*7)+'–'+(S.max*7)+'h</span>':'<span>'+days+' planned day'+(days===1?'':'s')+'</span>';
  var splitBar=['P','C','M','T'].map(function(k){return plan?'<i class="k-'+k+'" style="width:'+(sub[k]/plan*100).toFixed(2)+'%"></i>':''}).join('');
  var legend=['P','C','M','T'].map(function(k){return '<span class="k-'+k+'"><i class="dot"></i>'+SUBS[k]+' <b class="num">'+hh(sub[k])+'</b></span>'}).join('');
  el.innerHTML='<div class="sum">'+
    '<div class="stat"><b class="num">'+hh(plan)+'</b><span>Planned this '+per+'</span></div>'+
    '<div class="stat"><b class="num">'+hh(done)+'</b><span>Done</span></div>'+
    '<div class="stat"><b class="num">'+inT+'<small style="font-size:14px;font-weight:600;color:var(--ink-2)"> / '+days+'</small></b><span>Days in '+S.min+'–'+S.max+'h target</span></div>'+
    '<div class="split"><div class="splitbar" role="img" aria-label="Subject split">'+splitBar+'</div><div class="legend">'+(plan?legend:'<span>Nothing planned this '+per+' yet. Pick a day and use a template to start.</span>')+'</div></div>'+
    '</div>';
  if(tgt&&ui.view==='week')el.querySelector('.stat span').insertAdjacentHTML('afterend','<span>Target '+(S.min*7)+'–'+(S.max*7)+'h</span>');
}

function monthHTML(){
  var x=parse(ui.sel),Y=x.getFullYear(),M=x.getMonth(),first=iso(new Date(Y,M,1)),dim=new Date(Y,M+1,0).getDate();
  var start=addDays(first,-dow(first)),rows=Math.ceil((dow(first)+dim)/7),S=state.settings,out='';
  for(var i=0;i<rows*7;i++){
    var d=addDays(start,i),st=dayStats(d),dd=parse(d),isOut=dd.getMonth()!==M;
    out+='<button class="cell'+(isOut?' out':'')+(d===TODAY?' today':'')+(d===ui.sel?' sel':'')+'" data-act="pick" data-date="'+d+'" data-drop="'+d+'" aria-label="'+longDate(d)+(st.study?', '+hh(st.study)+' planned':'')+'">'+
      '<span class="ct"><span class="dn num">'+dd.getDate()+'</span><span class="hrs num '+hrsClass(st.study)+'">'+(st.study?hh(st.study):'')+'</span></span>'+
      bubbles(st.study,st.done,'')+
      testPill(d)+'<span class="cf"><span class="cnt num">'+(st.n?st.nd+'/'+st.n+' done':'')+'</span><span class="hrs hm num '+hrsClass(st.study)+'">'+(st.study?hh(st.study):'')+'</span>'+(d===S.exam?'<em class="tag">JEE Main</em>':'')+'</span></button>';
  }
  return '<div class="mh">'+DAYS.map(function(n){return '<span>'+n+'</span>'}).join('')+'</div><div class="mg">'+out+'</div>';
}
function cardHTML(t,cls){
  return '<div class="blk '+cls+' k-'+t.kind+(t.done?' done':'')+'" data-drag="'+t.id+'" draggable="true">'+
    '<span class="chip">'+(t.kind==='R'?'R':t.kind)+'</span>'+
    '<button class="cbody" data-act="edit" data-id="'+t.id+'"><b>'+esc(t.title)+'</b><small class="num">'+(t.date?range(t.start,t.start+t.dur)+' · ':'')+dur(t.dur)+' · '+esc(t.type)+resNote(t)+logNote(t)+'</small></button>'+
    (cls==='row'&&t.date===TODAY&&!t.done&&t.kind!=='R'?'<button class="mvb" data-act="timer-start" data-id="'+t.id+'" aria-label="Start a timer for “'+esc(t.title)+'”" title="Start timer">'+PLAY+'</button>':'')+
    (cls==='row'&&movable(t)?'<button class="mvb" data-act="to-bank" data-id="'+t.id+'" aria-label="Move “'+esc(t.title)+'” to the bank" title="Move to the bank">'+TRAY+'</button>':'')+

var TRAY='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5h3.2l.9 1.8h3.8l.9-1.8H14M2 9.5l1.6-5.8h8.8L14 9.5V13H2z"/></svg>';
var CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
function chkHTML(t){return '<button class="chk'+(t.done?' on':'')+'" data-act="toggle" data-id="'+t.id+'" aria-pressed="'+t.done+'" aria-label="Mark “'+esc(t.title)+'” done">'+CHECK+'</button>'}
function weekHTML(){
  var a=startOfWeek(ui.sel),out='';
  for(var i=0;i<7;i++){
    var d=addDays(a,i),st=dayStats(d),list=onDay(d);
    out+='<div class="wc'+(d===ui.sel?' sel':'')+(d===TODAY?' today':'')+'" data-drop="'+d+'">'+
      '<button class="wh" data-act="pick" data-date="'+d+'"><span class="row1"><b class="num">'+DAYS[i]+' '+parse(d).getDate()+'</b><span class="hrs num '+hrsClass(st.study)+'">'+(st.study?hh(st.study):'')+'</span></span>'+bubbles(st.study,st.done,'')+'</button>'+
      '<div class="wl">'+list.map(function(t){return cardHTML(t,'wcard')}).join('')+
      '<button class="wadd" data-act="add" data-date="'+d+'">+ Add</button></div></div>';
  }
  return '<div class="wk"><div class="wg">'+out+'</div></div>';
}
function layoutCols(list){
  var res={},cluster=[],cEnd=0;
  function flushC(){
    if(!cluster.length)return;
    var cols=[];
    cluster.forEach(function(t){
      var c=cols.findIndex(function(e){return e<=t.start});
      if(c<0){c=cols.length;cols.push(0)}
      cols[c]=t.start+t.dur;res[t.id]={col:c};
    });
    cluster.forEach(function(t){res[t.id].n=cols.length});
    cluster=[];
  }
  list.forEach(function(t){
    if(cluster.length&&t.start>=cEnd){flushC();cEnd=0}
    cluster.push(t);cEnd=Math.max(cEnd,t.start+t.dur);
  });
  flushC();
  return res;
}
function dayHTML(){
  var list=onDay(ui.sel),L=layoutCols(list),h='<div class="tlw" id="tlw"><div class="tli" style="height:'+((T1-T0)/60*HP)+'px">';
  for(var m=T0;m<=T1;m+=60)h+='<div class="hl" style="top:'+((m-T0)/60*HP)+'px"><span>'+hourLabel(m)+'</span></div>';
  h+='<div class="tbs" id="tbs" data-drop="'+ui.sel+'" data-tl="1">';
  gapsOf(ui.sel).forEach(function(g){
    var ghh=(g.e-g.s)/60*HP;
    h+='<div class="gapb" style="top:'+((g.s-T0)/60*HP)+'px;height:'+ghh+'px">'+(ghh>=20?'<span>'+(g.e-g.s>90?'Free time':'Rest')+' · '+dur(g.e-g.s)+'</span>':'')+'</div>';
  });
  list.forEach(function(t){
    var top=Math.max(0,(t.start-T0)/60*HP),ht=Math.max(12,t.dur/60*HP-2),l=L[t.id]||{col:0,n:1};
    var size=t.dur<=20?' xs':t.dur<45?' sm':'';
    h+='<div class="blk tb k-'+t.kind+(t.done?' done':'')+size+'" data-id="'+t.id+'" style="top:'+top+'px;height:'+ht+'px;left:calc('+(l.col/l.n*100)+'% + 2px);width:calc('+(100/l.n)+'% - 4px)">'+
      '<span class="grip" data-grip="1" aria-hidden="true"></span><span class="chip">'+t.kind+'</span>'+
      '<button class="cbody" data-act="edit" data-id="'+t.id+'"><b>'+esc(t.title)+'</b><small class="num">'+range(t.start,t.start+t.dur)+' · '+dur(t.dur)+' · '+esc(t.type)+resNote(t)+logNote(t)+'</small></button>'+
      chkHTML(t)+'<span class="rs" data-resize="1" aria-hidden="true"></span></div>';
  });
  if(ui.sel===TODAY){var n=new Date(),nm=n.getHours()*60+n.getMinutes();if(nm>=T0&&nm<=T1)h+='<div class="now" style="top:'+((nm-T0)/60*HP)+'px"></div>'}
  if(!list.length)h+='<div class="tl-empty"><b>Nothing planned for this day.</b><br>Click any empty slot to add a task at that time, or start from a template in the panel.</div>';
  return h+'</div></div></div>';
}


/* ---------- progress log: partly done, focus, questions, what got in the way ---------- */
var FOCUS=['Distracted','Low','OK','Good','Sharp'],WHY=['Distracted','Tired','Hard topic','Phone','Ran out of time'];
var near25=function(p){return clamp(Math.round(p/25)*25,25,100)};
function openLog(id,pre){
  var t=get(id);if(!t)return;
  pre=pre||{};
  var l=t.log||{},p=pre.p!=null?pre.p:(l.p!=null?l.p:100),m=pre.m!=null?pre.m:(l.m!=null?l.m:Math.round(t.dur*p/100));
  ui.overlay={kind:'log',id:id};
  var ps=[25,50,75,100].map(function(x){return '<label class="kopt"><input type="radio" name="p" value="'+x+'"'+(p===x?' checked':'')+'><span class="kb">'+x+'%</span></label>'}).join('');
  var fs=[1,2,3,4,5].map(function(x){return '<label class="kopt"><input type="radio" name="f" value="'+x+'"'+(l.f===x?' checked':'')+'><span class="kb"><b>'+x+'</b> '+FOCUS[x-1]+'</span></label>'}).join('');
  var ws=WHY.map(function(x){return '<label class="kopt"><input type="checkbox" name="w" value="'+x+'"'+((l.w||[]).indexOf(x)>=0?' checked':'')+'><span class="kb">'+x+'</span></label>'}).join('');
  var q=l.q||[];
  openOv('<form class="sheet" id="lf" novalidate role="dialog" aria-modal="true" aria-labelledby="lfh" autocomplete="off">'+
    '<h3 id="lfh">How did it go?</h3><p class="empty" style="margin:-4px 0 0"><b>'+esc(t.title)+'</b> · planned '+dur(t.dur)+'</p>'+
    '<fieldset class="kinds"><legend>How much of it did you finish?</legend>'+ps+'</fieldset>'+
    '<div class="grid3"><label class="f">Minutes studied<input type="number" id="lf-m" name="m" min="0" max="720" step="5" value="'+m+'"></label>'+
    '<label class="f">Questions done<input type="number" id="lf-qd" name="qd" min="0" step="1" value="'+(q[0]!=null?q[0]:'')+'"></label>'+
    '<label class="f">Questions planned<input type="number" id="lf-qp" name="qp" min="0" step="1" value="'+(q[1]!=null?q[1]:'')+'"></label></div>'+
    '<fieldset class="kinds"><legend>How focused were you?</legend>'+fs+'</fieldset>'+
    '<fieldset class="kinds"><legend>What got in the way? (optional)</legend>'+ws+'</fieldset>'+
    '<label class="f">Note<input name="n" maxlength="140" placeholder="e.g. got stuck on torque problems" value="'+esc(l.n||'')+'"></label>'+
    '<label class="cb"><input type="checkbox" name="rest" id="lf-rest"><span id="lf-rl"></span></label>'+
    '<p class="err" hidden></p>'+
    '<div class="actions">'+(t.done?'<button type="button" class="btn" data-act="log-undone">Mark not done</button>':'')+'<span class="sp"></span><button type="button" class="btn" data-act="close-ov">Cancel</button><button type="submit" class="btn pri">Save</button></div></form>');
  $('#lf-m').dataset.auto=pre.m!=null||l.m!=null?'0':'1';
  lfSync($('#lf'),true);
}
function lfRest(t,p){return Math.max(15,Math.ceil(t.dur*(100-p)/100/15)*15)}
function lfSync(f,init){
  var t=get(ui.overlay&&ui.overlay.id);if(!t||!f)return;
  var p=+(f.querySelector('[name=p]:checked')||{}).value||100,m=$('#lf-m');
  if(!init&&m.dataset.auto==='1')m.value=Math.round(t.dur*p/100);
  var rc=$('#lf-rest'),rl=$('#lf-rl');
  if(p<100){rl.textContent='Move the unfinished part ('+dur(lfRest(t,p))+') to the backlog';rc.disabled=false;if(init&&!t.log)rc.checked=true;if(!init&&rc.dataset.touched!=='1')rc.checked=true}
  else{rl.textContent='';rc.checked=false;rc.disabled=true}
  rc.parentNode.hidden=p>=100;
}
function saveLog(form){
  var id=ui.overlay&&ui.overlay.id,t=get(id);if(!t)return closeOv();
  var fd=new FormData(form),p=+fd.get('p')||100,m=+fd.get('m');
  if(isNaN(m)||m<0||m>720)return showErr(form,'Minutes studied must be between 0 and 720.','#lf-m');
  var qd=fd.get('qd')===''?null:+fd.get('qd'),qp=fd.get('qp')===''?null:+fd.get('qp');
  if((qd!=null&&(isNaN(qd)||qd<0))||(qp!=null&&(isNaN(qp)||qp<0)))return showErr(form,'Question counts must be 0 or more.','#lf-qd');
  var log={p:p,m:Math.round(m)};
  var f=+fd.get('f');if(f>=1&&f<=5)log.f=f;
  var w=fd.getAll('w');if(w.length)log.w=w;
  var n=String(fd.get('n')||'').trim();if(n)log.n=n;
  if(qd!=null||qp!=null)log.q=[qd,qp];
  var rest=fd.get('rest')==='on'&&p<100,moved=0;
  closeOv();
  mutate(function(){
    t.done=true;t.log=log;t.sample=false;
    if(rest){
      var base=t.title.replace(/ \(rest\)$/,'')+' (rest)';
      if(!state.tasks.some(function(x){return x.title===base&&!x.date&&x.from===t.date})){
        state.tasks.push({id:uid(),title:base,kind:t.kind,type:t.type,date:'',start:null,dur:lfRest(t,p),done:false,sample:false,from:t.date||''});moved=lfRest(t,p);
      }
    }
  },function(){return 'Logged '+p+'% done'+(log.f?' · focus '+log.f+'/5':'')+(moved?'. '+dur(moved)+' moved to the backlog.':'.')});
}

/* ---------- weekly review ---------- */
function weekData(a){
  var r={a:a,days:[],plan:0,done:0,sub:{P:{p:0,d:0},C:{p:0,d:0},M:{p:0,d:0},T:{p:0,d:0}},slipped:[],todo:[],tests:[],logs:[],hit:0},i;
  for(i=0;i<7;i++){
    var d=addDays(a,i),p=0,dn=0;
    onDay(d).forEach(function(t){
      if(t.kind==='R')return;
      p+=t.dur;dn+=eff(t);
      r.sub[t.kind].p+=t.dur;r.sub[t.kind].d+=eff(t);
      if(t.done&&t.log)r.logs.push(t);
      if(t.test)r.tests.push(t);
      if(!t.done&&!t.test){(d<TODAY?r.slipped:r.todo).push(t)}
    });
    r.days.push({d:d,p:p,dn:dn});r.plan+=p;r.done+=dn;
    if(dn>=state.settings.min*60)r.hit++;
  }
  return r;
}
function reviewHTML(){
  var a=startOfWeek(ui.sel),w=weekData(a),S=state.settings,mn=S.min*60;
  var pctDone=w.plan?Math.round(w.done/w.plan*100):0;
  var maxDay=Math.max.apply(null,w.days.map(function(x){return Math.max(x.p,x.dn)}).concat([mn,60]));
  var h='<div class="rv"><div class="card"><header><h3>Week at a glance<small>'+periodLabel()+'</small></h3></header><div class="rvs">'+
    '<div><b class="num">'+hh(w.plan)+'</b><span>Planned</span></div><div><b class="num">'+hh(w.done)+'</b><span>Done</span></div>'+
    '<div><b class="num">'+pctDone+'%</b><span>Of the plan finished</span></div><div><b class="num">'+w.hit+' / 7</b><span>Days with '+S.min+'h+ done</span></div></div></div>';
  h+='<div class="card"><header><h3>Hours by day<small>filled = done, outline = planned, line = '+S.min+'h target</small></h3></header><div class="dcols" role="img" aria-label="Planned and done hours for each day of the week">'+
    w.days.map(function(x,i){
      return '<div class="dcol'+(x.d===TODAY?' today':'')+'"><div class="dbar" style="--t:'+(mn/maxDay*100)+'%"><i class="pl" style="height:'+(x.p/maxDay*100)+'%"></i><i class="dn" style="height:'+(x.dn/maxDay*100)+'%"></i></div><b class="num">'+hh(x.dn)+'</b><small class="num">of '+hh(x.p)+'</small><span>'+DAYS[i]+' '+parse(x.d).getDate()+'</span></div>';
    }).join('')+'</div></div>';
  var rows=['P','C','M','T'].map(function(k){
    var q=w.sub[k];if(!q.p&&!q.d)return '';
    var mxs=Math.max(w.sub.P.p,w.sub.C.p,w.sub.M.p,w.sub.T.p,1);
    return '<div class="srow k-'+k+'"><span class="sl">'+SUBS[k]+'</span><div class="sbar"><i class="pl" style="width:'+(q.p/mxs*100)+'%"></i><i class="dn" style="width:'+(q.d/mxs*100)+'%"></i></div><span class="sv num"><b>'+hh(q.d)+'</b> of '+hh(q.p)+' · '+(q.p?Math.round(q.d/q.p*100):0)+'%</span></div>';
  }).join('');
  var low=null;['P','C','M'].forEach(function(k){var q=w.sub[k];if(q.p>=60&&(!low||q.d/q.p<w.sub[low].d/w.sub[low].p))low=k});
  var tot3=w.sub.P.d+w.sub.C.d+w.sub.M.d,note='';
  if(low&&w.sub[low].d/w.sub[low].p<0.8&&w.plan&&addDays(a,6)>=TODAY)note='<p class="rvn"><b>'+SUBS[low]+'</b> is the least finished subject ('+Math.round(w.sub[low].d/w.sub[low].p*100)+'% of its plan). Give it the first slot tomorrow.</p>';
  h+='<div class="card"><header><h3>By subject</h3></header>'+(rows?rows:'<p class="empty">Nothing planned this week.</p>')+note+'</div>';
  if(w.logs.length){
    var fs=w.logs.filter(function(t){return t.log.f}),avg=fs.length?fs.reduce(function(a,t){return a+t.log.f},0)/fs.length:0;
    var part=w.logs.filter(function(t){return t.log.p<100}).length,why={};
    w.logs.forEach(function(t){(t.log.w||[]).forEach(function(x){why[x]=(why[x]||0)+1})});
    var top=Object.keys(why).sort(function(a,b){return why[b]-why[a]}).slice(0,3).map(function(x){return x+' ×'+why[x]}).join(', ');
    h+='<div class="card"><header><h3>How sessions went<small>'+w.logs.length+' logged</small></h3></header><p class="rvn" style="margin:0">'+(fs.length?'Average focus <b class="num">'+avg.toFixed(1)+' / 5</b>. ':'')+(part?'<b class="num">'+part+'</b> task'+(part>1?'s were':' was')+' only partly done. ':'All logged tasks were finished. ')+(top?'What got in the way most: '+top+'.':'')+'</p></div>';
  }
  /* tests */
  h+='<div class="card"><header><h3>Tests this week</h3></header>'+(w.tests.length?'<ul class="lst">'+w.tests.map(function(t){
    var r=t.test.res;
    return '<li class="rvt"><span><b>'+esc(t.title)+'</b><small>'+shortDate(t.date)+'</small></span><span class="num">'+(r?'<b>'+pc(r.tot/t.test.max*100)+'</b>'+(r.rank?' · rank '+r.rank:''):(t.date<=TODAY?'<span class="miss-tag">awaiting result</span>':'upcoming'))+'</span></li>';
  }).join('')+'</ul>':'<p class="empty">No tests this week.</p>')+'</div>';
  /* slipped */
  var sl=w.slipped;
  h+='<div class="card"><header><h3>What slipped<small>unfinished tasks on days that have passed</small></h3>'+(sl.length?'<button class="btn sm pri" data-act="rv-bank">Move '+sl.length+' to the backlog</button>':'')+'</header>'+
    (sl.length?'<ul class="lst">'+sl.slice(0,10).map(function(t){return '<li class="rvt"><span><b>'+esc(t.title)+'</b><small>'+shortDate(t.date)+'</small></span><span class="num">'+dur(t.dur)+'</span></li>'}).join('')+(sl.length>10?'<li class="empty">and '+(sl.length-10)+' more</li>':'')+'</ul>':'<p class="empty">Nothing slipped. Every task on a passed day is done.</p>')+'</div>';
  /* next week */
  var nb=addDays(a,7),nw=weekData(nb),bk=bank().length;
  h+='<div class="card"><header><h3>Next week</h3><div class="acts"><button class="btn sm" data-act="rv-next">Open next week</button>'+(bk?'<button class="btn sm pri" data-act="autofill">Schedule '+bk+' backlog item'+(bk>1?'s':'')+'</button>':'')+'</div></header>'+
    '<p class="rvn" style="margin:0"><b class="num">'+hh(nw.plan)+'</b> planned across '+nw.days.filter(function(x){return x.p>0}).length+' days. '+(nw.days.filter(function(x){return x.p<mn}).length?nw.days.filter(function(x){return x.p<mn}).length+' day'+(nw.days.filter(function(x){return x.p<mn}).length>1?'s are':' is')+' under the '+S.min+'h target.':'Every day meets the target.')+'</p></div></div>';
  return h;
}

/* ---------- study timer ---------- */
var TK='jee-planner-timer',timer=null,tmI=0,baseTitle=document.title,audio=null;
var PLAY='<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.2v9.6L13 8z"/></svg>';
function saveTimer(){try{if(timer)localStorage.setItem(TK,JSON.stringify(timer));else localStorage.removeItem(TK)}catch(e){}}
function loadTimer(){try{var o=JSON.parse(localStorage.getItem(TK)||'null');if(o&&o.id&&get(o.id)&&!get(o.id).done)timer=o}catch(e){}}
function tmRem(){return !timer?0:timer.paused!=null?timer.paused:Math.max(0,timer.end-Date.now())}
function tmFmt(ms){var s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s=s%60;return (h?h+':'+pad(m):m)+':'+pad(s)}
function startTimer(id){
  var t=get(id);if(!t||t.done||t.kind==='R')return;
  try{if(!audio&&window.AudioContext)audio=new AudioContext();if(audio&&audio.state==='suspended')audio.resume()}catch(e){}
  try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
  var n=new Date(),nowMs=n.getTime(),nm=n.getHours()*60+n.getMinutes()+n.getSeconds()/60,span=t.dur*60000,capped=false,slotEnd=null;
  if(t.date===TODAY&&t.start!=null){
    var te=t.start+t.dur;
    if(nm>=t.start&&nm<te){var rem=(te-nm)*60000;if(rem<span&&rem>=5*60000){span=rem;capped=true;slotEnd=te}}
    else{var nx=onDay(TODAY).filter(function(x){return x.id!==t.id&&x.start>nm})[0];if(nx){var gp=(nx.start-nm)*60000;if(gp<span&&gp>=5*60000){span=gp;capped=true;slotEnd=nx.start}}}
  }
  timer={id:id,title:t.title,total:span,planned:t.dur*60000,end:nowMs+span,paused:null,fired:false,capped:capped,slotEnd:slotEnd};
  saveTimer();renderTimer();
}
function stopTimer(){timer=null;saveTimer();renderTimer()}
function endTimer(mode){
  if(!timer)return;
  var id=timer.id,t=get(id),studied=Math.round((timer.total-tmRem())/60000),planned=Math.round(timer.planned/60000);
  stopTimer();
  if(!t||t.done)return;
  var pct=planned?Math.min(100,studied/planned*100):100;
  if(mode==='done'&&pct>=90){
    mutate(function(){t.done=true;t.log={p:100,m:studied};t.sample=false},'Marked done. '+studied+' minutes logged.');
    return;
  }
  if(studied<3){toast('Timer stopped. Under 3 minutes, so nothing was logged.');return}
  openLog(id,{m:studied,p:near25(pct)});
}
function beep(){
  try{if(!audio)return;[0,.28,.56].forEach(function(d){var o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+d);o.stop(audio.currentTime+d+.18)})}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200,100,200])}catch(e){}
}
function tmTick(){
  if(!timer){return}
  if(!get(timer.id)||get(timer.id).done){stopTimer();return}
  var r=tmRem(),c=$('#tm-clock'),f=$('#tm-fill');
  if(c)c.textContent=timer.fired?'Time is up':tmFmt(r);
  if(f)f.style.width=Math.min(100,(1-r/timer.total)*100)+'%';
  document.title=(timer.fired?'Time is up':tmFmt(r))+' · '+timer.title;
  if(!timer.fired&&timer.paused==null&&r<=0){
    timer.fired=true;saveTimer();renderTimer();beep();
    try{if(window.Notification&&Notification.permission==='granted')new Notification('Time is up',{body:timer.title})}catch(e){}
  }
}
function renderTimer(){
  var el=$('#timer');if(!el)return;
  clearInterval(tmI);tmI=0;
  document.body.classList.toggle('has-timer',!!timer);
  if(!timer){el.hidden=true;el.innerHTML='';document.title=baseTitle;return}
  var paused=timer.paused!=null;
  el.hidden=false;
  el.innerHTML='<div class="tmr'+(timer.fired?' up':'')+'" role="timer"><div class="tmi"><span class="tmt">'+esc(timer.title)+'</span><b class="num" id="tm-clock"></b></div><div class="tmb"><i id="tm-fill"></i></div>'+

var TEST_KINDS={
  full:{label:'Full test',short:'Full test',dur:180,max:300,start:540,subs:'PCM'},
  part:{label:'Part test',short:'Part test',dur:120,max:200,start:960,subs:'PCM'},

};
var SERIES={tot:{label:'Total',cls:'s-tot'},P:{label:'Physics',cls:'s-P'},C:{label:'Chemistry',cls:'s-C'},M:{label:'Maths',cls:'s-M'}};
var cloneTest=function(x){return {k:x.k,max:x.max,subs:x.subs,syl:x.syl||'',res:null}};
var isTest=function(t){return !!t.test};
var allTests=function(){return state.tasks.filter(isTest)};
var byWhen=function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.start-b.start};
var mean=function(a){return a.reduce(function(x,y){return x+y},0)/a.length};
var pc=function(v){return (Math.round(v*10)/10)+'%'};
var dmon=function(d){var x=parse(d);return x.getDate()+' '+MON[x.getMonth()]};
function pctOf(t){var r=t.test&&t.test.res;return r&&t.test.max?r.tot/t.test.max*100:null}
function subMax(t){return t.test.max/Math.max(1,t.test.subs.length)}
function subVal(t,k){
  var r=t.test.res;if(!r||t.test.subs.indexOf(k)<0)return null;
  if(t.test.subs.length===1)return r.tot;
  return typeof r[k]==='number'?r[k]:null;
}
function subPct(t,k){var v=subVal(t,k);return v==null?null:v/subMax(t)*100}
function pctile(t){
  var r=t.test.res;if(!r)return null;
  if(typeof r.pct==='number')return r.pct;
  if(r.rank&&r.of&&r.rank<=r.of)return (r.of-r.rank+1)/r.of*100;
  return null;
}
function testPill(d){
  var ts=onDay(d).filter(isTest);
  if(!ts.length)return '';
  ts.sort(byWhen);
  var shown=ts.slice(0,2).map(function(t){return '<span class="tpill" title="'+esc(t.title)+'">'+esc(t.title)+'</span>'}).join('');
  return '<span class="tps">'+shown+(ts.length>2?'<span class="tpill">+'+(ts.length-2)+' more</span>':'')+'</span>';
}
function resNote(t){var p=pctOf(t);return p==null?'':' · '+pc(p)}
function logNote(t){var l=t.done&&t.log;if(!l)return '';return (l.p!=null&&l.p<100?' · '+l.p+'% done':'')+(l.f?' · focus '+l.f+'/5':'')}

/* ---------- tests view ---------- */
function resultsInScope(all){
  var min=ui.tf.range?addDays(TODAY,-ui.tf.range):'';
  return allTests().filter(function(t){return t.test.res&&(all||t.test.subs!=='O')&&(ui.tf.kind==='all'||t.test.k===ui.tf.kind)&&t.date>=min}).sort(byWhen);
}
function testsStats(res){
  var pcts=res.map(pctOf),o={n:res.length,avg:null,last:null,delta:null,weak:null};
  if(pcts.length){
    o.avg=mean(pcts);o.last=pcts[pcts.length-1];
    var prev=pcts.slice(Math.max(0,pcts.length-4),pcts.length-1);
    if(prev.length)o.delta=o.last-mean(prev);
  }
  var subs=[];
  ['P','C','M'].forEach(function(k){
    var a=res.map(function(t){return subPct(t,k)}).filter(function(v){return v!=null});
    if(a.length)subs.push({k:k,avg:mean(a)});
  });
  if(subs.length>=2)o.weak=subs.reduce(function(a,b){return b.avg<a.avg?b:a});
  return o;
}
function renderTestsView(){
  var all=allTests();
  if(!all.length){
    return '<section class="card"><h3>No tests yet</h3><p class="empty" style="margin:8px 0 14px">Add chapter tests and full tests one by one, or import a whole schedule at once. After each test, record the marks and rank here to see your trend.</p>'+
      '<div class="acts"><button class="btn pri" data-act="import">Import schedule</button><button class="btn" data-act="add-test">+ Add test</button><button class="btn" data-act="sample-tests">Try with sample tests</button></div></section>';

function scoreCfg(res){
  var keys=['tot','P','C','M'].filter(function(k){return ui.series[k]});
  var pts=res.map(function(t){
    var v={tot:pctOf(t),P:subPct(t,'P'),C:subPct(t,'C'),M:subPct(t,'M')},rows=[];
    keys.forEach(function(k){if(v[k]!=null)rows.push({cls:SERIES[k].cls,label:SERIES[k].label,text:pc(v[k])+(k==='tot'?'  ('+t.test.res.tot+'/'+t.test.max+')':'')})});
    return {date:t.date,name:t.title,sub:TEST_KINDS[t.test.k].label+' · '+dmon(t.date),v:v,rows:rows};
  });
  var vals=[];
  pts.forEach(function(p){keys.forEach(function(k){if(p.v[k]!=null)vals.push(p.v[k])})});
  var ymin=Math.min(60,Math.floor(((vals.length?Math.min.apply(null,vals):0)-5)/20)*20),ticks=[];
  for(var t=ymin;t<=100;t+=20)ticks.push(t);
  var first=vals.length?pts[0].v.tot:null,last=pts.length?pts[pts.length-1].v.tot:null;
  return {pts:pts,series:keys.map(function(k){return {key:k,cls:SERIES[k].cls}}),y:{min:ymin,max:100,ticks:ticks,fmt:function(v){return v+'%'},lab:pc},
    label:'Marks as a percentage of the maximum across '+pts.length+' tests'+(first!=null&&last!=null?', from '+pc(first)+' to '+pc(last):'')+'. Full values are in the table below.',
    empty:'No results in this selection. Add a result from the table below and the trend will appear here.'};
}
function niceStep(x){var p=Math.pow(10,Math.floor(Math.log(x)/Math.LN10)),f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function rankCfg(res,mode){
  var pts,y;
  if(mode==='pct'){
    var rs=res.filter(function(t){return pctile(t)!=null});
    pts=rs.map(function(t){var r=t.test.res,p=pctile(t);
      return {date:t.date,name:t.title,sub:TEST_KINDS[t.test.k].label+' · '+dmon(t.date),v:{m:p},rows:[{cls:'s-tot',label:'Percentile',text:p.toFixed(1)}].concat(r.rank?[{label:'Rank',text:r.rank+(r.of?' of '+r.of:'')}]:[])}});
    var mn=pts.length?Math.min.apply(null,pts.map(function(p){return p.v.m})):0,lo=Math.max(0,Math.floor((mn-5)/10)*10),tk=[],stp=(100-lo)>40?20:10;
    for(var t=lo;t<=100;t+=stp)tk.push(t);
    y={min:lo,max:100,ticks:tk,fmt:function(v){return String(v)},lab:function(v){return v.toFixed(1)}};
  }else{
    var rr=res.filter(function(t){return t.test.res.rank});
    pts=rr.map(function(t){var r=t.test.res,p=pctile(t);
      return {date:t.date,name:t.title,sub:TEST_KINDS[t.test.k].label+' · '+dmon(t.date),v:{m:r.rank},rows:[{cls:'s-tot',label:'Rank',text:r.rank+(r.of?' of '+r.of:'')}].concat(p!=null?[{label:'Percentile',text:p.toFixed(1)}]:[])}});
    var mx=pts.length?Math.max.apply(null,pts.map(function(p){return p.v.m})):10,stp2=niceStep(Math.max(1,(mx-1))/4),top=Math.max(stp2,Math.ceil(mx/stp2)*stp2),tk2=[1];
    for(var q=stp2;q<=top;q+=stp2)if(q>1+stp2*0.5)tk2.push(q);
    y={min:1,max:Math.max(top,2),ticks:tk2,fmt:function(v){return String(v)},invert:true,lab:function(v){return String(v)}};
  }
  return {pts:pts,series:[{key:'m',cls:'s-tot'}],y:y,
    label:(mode==='pct'?'Percentile':'Rank')+' across '+pts.length+' tests. Full values are in the table below.',
    empty:'No '+(mode==='pct'?'percentile':'rank')+' data yet. Enter the rank'+(mode==='pct'?' and the number of students':'')+' when you record a result.'};
}

function drawChart(host,cfg){
  host.textContent='';

  if(!n){
    var e=document.createElement('div');e.className='plot-empty';e.textContent=cfg.empty;
    host.appendChild(e);host.style.height='auto';host.removeAttribute('tabindex');return;
  }
  host.style.height='250px';host.setAttribute('tabindex','0');
  var W=Math.max(280,host.clientWidth),H=250,m={l:44,r:56,t:14,b:30},pw=W-m.l-m.r,ph=H-m.t-m.b,pad=8,NS='http://www.w3.org/2000/svg',y=cfg.y;
  function el(name,attrs,parent){var x=document.createElementNS(NS,name);for(var k in attrs)x.setAttribute(k,attrs[k]);if(parent)parent.appendChild(x);return x}
  var svg=el('svg',{viewBox:'0 0 '+W+' '+H,width:W,height:H,role:'img','aria-label':cfg.label},host);
  var xAt=function(i){return n===1?m.l+pw/2:m.l+pad+(pw-2*pad)*i/(n-1)};
  var yAt=function(v){var f=(v-y.min)/(y.max-y.min);return m.t+(y.invert?f:1-f)*ph};
  y.ticks.forEach(function(tk){
    var yy=yAt(tk);
    el('line',{'class':'gl',x1:m.l,x2:W-m.r,y1:yy,y2:yy},svg);
    el('text',{'class':'ax',x:m.l-8,y:yy+4,'text-anchor':'end'},svg).textContent=y.fmt(tk);
  });
  var stepPx=n>1?(pw-2*pad)/(n-1):pw,every=Math.max(1,Math.ceil(58/stepPx));
  pts.forEach(function(p,i){if(i%every)return;el('text',{'class':'ax',x:xAt(i),y:H-8,'text-anchor':'middle'},svg).textContent=dmon(p.date)});
  var usedY=[];
  cfg.series.forEach(function(s){
    var pairs=[];
    pts.forEach(function(p,i){var v=p.v[s.key];if(v!=null)pairs.push([xAt(i),yAt(v),v])});
    if(pairs.length>1)el('path',{'class':'ln '+s.cls,d:pairs.map(function(q,j){return (j?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}).join(' ')},svg);
    pairs.forEach(function(q,j){if(n<=20||j===pairs.length-1)el('circle',{'class':'mk '+s.cls,cx:q[0],cy:q[1],r:5},svg)});
    if(pairs.length){
      var q=pairs[pairs.length-1],ok=usedY.every(function(u){return Math.abs(u-q[1])>=13});
      if(ok){usedY.push(q[1]);el('text',{'class':'lbl',x:q[0]+11,y:q[1]+4},svg).textContent=y.lab(q[2])}
    }
  });
  var xh=el('line',{'class':'xh',x1:0,x2:0,y1:m.t,y2:m.t+ph,visibility:'hidden'},svg),hv=el('g',{},svg);
  var tip=document.createElement('div');tip.className='tip';tip.hidden=true;host.appendChild(tip);
  var cur=null;
  function hide(){cur=null;xh.setAttribute('visibility','hidden');hv.textContent='';tip.hidden=true}
  function show(i){
    cur=i;var p=pts[i],x=xAt(i);
    xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.setAttribute('visibility','visible');
    hv.textContent='';
    cfg.series.forEach(function(s){var v=p.v[s.key];if(v!=null)el('circle',{'class':'mk '+s.cls,cx:x,cy:yAt(v),r:6},hv)});
    tip.textContent='';
    var h=document.createElement('div');h.className='tip-h';
    var b=document.createElement('b');b.textContent=p.name;h.appendChild(b);h.appendChild(document.createTextNode(p.sub));tip.appendChild(h);
    p.rows.forEach(function(r){
      var row=document.createElement('div');row.className='tip-r '+(r.cls||'');
      if(r.cls){var k=document.createElement('i');k.className='key';row.appendChild(k)}
      var l=document.createElement('span');l.className='tl';l.textContent=r.label;
      var v=document.createElement('b');v.textContent=r.text;
      row.appendChild(l);row.appendChild(v);tip.appendChild(row);
    });
    tip.hidden=false;
    var tw=tip.offsetWidth,left=x+14;
    if(left+tw>W-4)left=x-14-tw;
    tip.style.left=Math.max(4,left)+'px';tip.style.top=(m.t+4)+'px';
  }
  function idxAt(e){

  }
  svg.addEventListener('pointermove',function(e){show(idxAt(e))});
  svg.addEventListener('pointerdown',function(e){show(idxAt(e))});
  svg.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')hide()});
  host.onkeydown=function(e){
    var d=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0;

  };

function analysisFor(t){

}

function parseCSV(text){

  var rows=[],row=[],cell='',q=false,i,c;
  for(i=0;i<text.length;i++){
    c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===best){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';rows.push(row);row=[]}

function parseDateStr(v){

function oneTime(s){

function parseDur(v){

function numOr(v){if(v==null)return null;var s=String(v).trim().replace(/,/g,'');if(s===''||s==='-')return null;var x=+s;return isNaN(x)?NaN:x}

function analyseImport(text){
  var out={rows:[],err:null,c:{add:0,upd:0,dup:0,bad:0}};

  if(!text)return out;
  var list;
  try{
    if(text[0]==='{'||text[0]==='['){
      var j=JSON.parse(text);
      list=Array.isArray(j)?j:(j.tests||j.exams||j.schedule||[]);
    }else{
      var rows=parseCSV(text);
      if(rows.length<2){out.err='Add a header row (date,name,type,...) and at least one test below it.';return out}
      var hdr=rows[0].map(function(h){return String(h).trim()});
      list=rows.slice(1).map(function(r){var o={};hdr.forEach(function(h,i){o[h]=r[i]!==undefined?String(r[i]).trim():''});return o});
    }
  }catch(e){out.err='This is not valid JSON or CSV. '+(e&&e.message?e.message:'');return out}
  if(!Array.isArray(list)||!list.length){out.err='No tests found. For JSON, put them in a "tests" list.';return out}
  var have={};
  allTests().forEach(function(t){have[t.date+'|'+t.title.toLowerCase().trim()]=t});
  var seen={};
  list.slice(0,500).forEach(function(raw,i){
    var r={n:i+1,status:'bad',reason:''};

    var x=normRow(raw);

      else{r.status='dup';r.reason='Already in your planner.';out.c.dup++}

        var nt={id:uid(),title:t.name,kind:'T',type:TEST_KINDS[t.k].label,date:t.date,start:t.start,dur:t.dur,done:!!t.res,sample:false,test:{k:t.k,max:t.max,subs:t.subs,syl:t.syl,res:t.res}};
        state.tasks.push(nt);
        if(withAna&&!t.res)analysisFor(nt);
      }else{
        var ex=get(r.target);if(ex&&ex.test){ex.test.res=t.res;ex.done=true}
      }
    });
  },'Imported '+a.c.add+' test'+(a.c.add===1?'':'s')+(a.c.upd?' and '+a.c.upd+' result'+(a.c.upd===1?'':'s'):'')+(a.c.dup?' ('+a.c.dup+' skipped)':''));
  if(first&&ui.view!=='tests'){ui.sel=first;render()}
}

    [-10,'Full test 4','full',300,'PCM',[72,78,69],null,190,1200,'Full syllabus',540,180],
    [-3,'Chapter test: Definite integrals','chapter',100,'M',null,74,14,140,'Definite integrals',960,60]
  ];
  past.forEach(function(p){add(p[0],p[1],p[2],p[3],p[4],p[5],p[6],p[7],p[8],p[9],p[10],p[11],true)});

/* HTML5 drag and drop: bank rows and week cards onto days, bank rows onto the timeline */
var dropEl=null;
document.addEventListener('dragstart',function(e){
  var c=e.target.closest&&e.target.closest('[data-drag]');if(!c)return;
  e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move';
  setTimeout(function(){c.classList.add('dragging')},0);
});
document.addEventListener('dragover',function(e){
  var z=e.target.closest&&e.target.closest('[data-drop]');
  if(dropEl&&dropEl!==z)dropEl.classList.remove('drop');
  dropEl=z;
  if(z){e.preventDefault();z.classList.add('drop');e.dataTransfer.dropEffect='move'}
});
document.addEventListener('drop',function(e){
  var z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;
  e.preventDefault();z.classList.remove('drop');
  var id=e.dataTransfer.getData('text/plain');if(!get(id))return;
  if(z.dataset.drop==='bank'){toBank([id]);return}
  var m=null;
  if(z.dataset.tl){var r=z.getBoundingClientRect();m=clamp(Math.round(((e.clientY-r.top)/HP*60+T0)/15)*15,T0,T1-15)}
  moveTask(id,z.dataset.drop,m);
});
document.addEventListener('dragend',function(){
  if(dropEl)dropEl.classList.remove('drop');dropEl=null;
  document.querySelectorAll('.dragging').forEach(function(x){x.classList.remove('dragging')});
});

/* pointer drag on the day timeline: move (whole block with a mouse, grip with touch) and resize (bottom edge) */
var drag=null;
document.addEventListener('pointerdown',function(e){
  var blk=e.target.closest&&e.target.closest('.tb');if(!blk||e.target.closest('.chk'))return;
  var rs=!!e.target.closest('[data-resize]'),gr=!!e.target.closest('[data-grip]');
  if(e.pointerType==='touch'&&!rs&&!gr)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  var t=get(blk.dataset.id);if(!t)return;
  drag={blk:blk,t:t,mode:rs?'rs':'mv',y0:e.clientY,s0:t.start,d0:t.dur,ns:t.start,nd:t.dur,moved:false,pid:e.pointerId};
});
document.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.pid)return;
  var dy=e.clientY-drag.y0;
  if(!drag.moved){
    if(Math.abs(dy)<4)return;
    drag.moved=true;
    try{drag.blk.setPointerCapture(e.pointerId)}catch(x){}
    drag.blk.classList.add('dragging-now');
  }
  var dm=Math.round(dy/HP*4)*15;
  if(drag.mode==='mv'){
    var under=document.elementFromPoint(e.clientX,e.clientY),bz=under&&under.closest&&under.closest('[data-drop="bank"]');
    var bzEl=document.getElementById('bankz');
    drag.bank=!!bz&&movable(drag.t);
    if(bzEl)bzEl.classList.toggle('drop',drag.bank);
    drag.blk.classList.toggle('to-bank',drag.bank);
  }
  if(drag.mode==='mv'){drag.ns=clamp(drag.s0+dm,T0,T1-drag.d0);drag.blk.style.top=((drag.ns-T0)/60*HP)+'px'}
  else{drag.nd=clamp(drag.d0+dm,15,T1-drag.s0);drag.blk.style.height=Math.max(12,drag.nd/60*HP-2)+'px'}
  var sm=drag.blk.querySelector('small');
  if(sm)sm.textContent=range(drag.ns,drag.ns+drag.nd)+' · '+dur(drag.nd)+' · '+drag.t.type;
  e.preventDefault();
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.pid)return;
  var d=drag;drag=null;
  if(!d.moved)return;
  ui.suppress=true;setTimeout(function(){ui.suppress=false},50);
  var bzEl=document.getElementById('bankz');if(bzEl)bzEl.classList.remove('drop');
  if(!cancel&&d.bank){toBank([d.t.id]);return}
  if(cancel||(d.ns===d.s0&&d.nd===d.d0)){render();return}
  mutate(function(){d.t.start=d.ns;d.t.dur=d.nd;d.t.sample=false},d.mode==='mv'?'Moved to '+clock(d.ns):'Duration set to '+dur(d.nd));
}
document.addEventListener('pointerup',function(e){endDrag(e,false)});
document.addEventListener('pointercancel',function(e){endDrag(e,true)});
